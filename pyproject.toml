[project]
name = "maestro"
version = "0.1.0"
description = "Telegram-бот записи к мастерам и админ-панель"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC",# flake8-async
    "S",    # bandit
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # длину строк контролирует black
    "B008",    # вызов в аргументах по умолчанию (паттерн FastAPI/aiogram)
    "RUF001",  # кириллические символы в строках — это наш язык интерфейса
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"seed_db.py" = ["S"]
"tests/*" = ["S101"]  # assert в тестах разрешён

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Постепенное ужесточение: сначала новые модули, потом весь проект.
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
