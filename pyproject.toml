[project]
name = "maestro"
version = "0.1.0"
description = "Telegram-бот записи к мастерам и админ-панель"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | \.venv_old310
  | venv
  | build
  | dist
  | migrations/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "ASYNC",# flake8-async
    "S",    # bandit
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # длину строк контролирует black
    "B008",    # вызов в аргументах по умолчанию (паттерн FastAPI/aiogram)
    "RUF001",  # кириллические символы в строках — это наш язык интерфейса
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/seed_db.py" = ["S"]
"tests/*" = ["S101", "S105", "S106"]  # assert и тестовые «секреты» разрешены
# sqladmin описывает представления списками на уровне класса — это его API, не ошибка.
"admin_panel.py" = ["RUF012"]
# Миграции пишут SQL строками по определению, и Alembic сам генерирует их шаблон.
"migrations/*" = ["S608", "E501", "I001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Постепенное ужесточение: сначала новые модули, потом весь проект.
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
